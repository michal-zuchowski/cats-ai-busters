name: K65 build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.K65_DEPLOY_KEY }}
      - run: sudo apt-get update && sudo apt-get install -y gawk g++ make
      - run: bash ci/k65-build.sh

  go-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l tools tests)"
      - run: go vet ./...
      - run: go test ./...
